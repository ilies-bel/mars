name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator:
    name: Orchestrator (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: orchestrator/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm test

  ui:
    name: UI (typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: ui/pnpm-lock.yaml

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

      - run: pnpm run build

      # The job set up Bun but never ran a test, so ui/'s 2,187 tests
      # (vitest src+server, plus the Bun-native server suite) gated nothing.
      # That is how ui/server/chatRoutes.test.ts stayed unexecuted and how
      # progress.test.ts sat red on main. `pnpm test` covers all three:
      # lint:tokens, test:src, test:server.
      - run: pnpm test

  packages:
    name: Packages (@mars/workflow, @mars/claude-session)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [workflow, claude-session]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Both packages declare a `test` script and together carry 20 test
      # files, but no job ran them — they are consumed by path from
      # orchestrator/ and ui/, which never invoke their suites.
      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      - run: npm test

  repo-hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Forbid tracked artifacts
        run: |
          set -e
          patterns=(
            '(^|/)\.env$'
            '(^|/)\.env\.local$'
            '(^|/)\.mars/'
            '(^|/)\.worktrees/'
            '(^|/)node_modules/'
            '\.duckdb(\.wal)?$'
            '\.tsbuildinfo$'
          )
          tracked=$(git ls-files)
          fail=0
          for pat in "${patterns[@]}"; do
            hits=$(printf '%s\n' "$tracked" | grep -E "$pat" || true)
            if [ -n "$hits" ]; then
              echo "::error::Forbidden tracked files match /$pat/:"
              echo "$hits"
              fail=1
            fi
          done
          exit $fail

  install-smoke:
    name: install-dev.sh smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run install-dev.sh against the checkout
        run: |
          set -euxo pipefail
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          bash ./install-dev.sh
          command -v mars
          mars --help || mars help || true

  arch:
    # Static architecture guard: import cycles are an ERROR, orphan modules a
    # WARN, across orchestrator/ + packages/ and (with its own `@/*` alias
    # config) ui/.
    #
    # This tree is already 28-of-49 folders cyclic, so `no-circular` could not
    # simply be switched on. Today's cycles are frozen in the committed
    # known-violations baselines and this job fails only on violations that are
    # NOT in them — i.e. on cycles the PR itself introduced. The baselines are a
    # ratchet: they may only ever shrink. A PR that GROWS one is regenerating to
    # silence itself and should be rejected.
    #
    # Runs off the ROOT install alone — deliberately. It needs no orchestrator/
    # or ui/ node_modules: every first-party import in this repo resolves by
    # relative path or through the tsconfig alias, so nothing external needs to
    # be present for the cycle graph to be complete. Keeps the job to one small
    # install.
    name: Architecture (import cycles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '10.28.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Assert the baselines were not grown to silence a new cycle
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            echo "not a pull request — skipping the ratchet-direction check"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$base"
          fail=0
          for f in .dependency-cruiser-known-violations.json ui/.dependency-cruiser-known-violations.json; do
            before=$(git show "$base:$f" 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(s.trim()?JSON.parse(s).length:0))' || echo 0)
            after=$(node -e 'console.log(require("./'"$f"'").length)')
            echo "$f: $before -> $after accepted violations"
            if [ "$after" -gt "$before" ]; then
              echo "::error file=$f::Architecture baseline GREW ($before -> $after). The baseline is a ratchet and may only shrink. Fix the cycle instead of recording it. If you deliberately enabled a NEW rule, say so in the PR description and a maintainer can override."
              fail=1
            fi
          done
          exit $fail

      - name: Cycle guard
        run: pnpm run arch

  scripts:
    # Verify the root-level scripts/ Node.js helpers and their inline tests.
    # These scripts are used by release workflows and are not covered by the
    # orchestrator vitest suite (which lives under orchestrator/src/).
    name: Root scripts tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run scripts test suite
        run: npm run test-scripts

  templates-sync:
    # `orchestrator/src/init/templates/CLAUDE.md` and
    # `orchestrator/src/init/templates/claude/**` are tracked files
    # mechanically derived from the root `CLAUDE.md` + `.claude/` by
    # `scripts/sync-claude-templates.sh` (the npm prebuild/pretest hook).
    # If the committed copy drifts from source, every task that runs
    # `npm run build`/`npm test` in its worktree regenerates them, dirties
    # the merge target, and fails `merge:preflight/uncommitted-changes`.
    # This job fails LOUDLY at PR time so the staleness can never silently
    # recur: re-run the sync and commit the regenerated files.
    name: Init templates in sync with source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate templates and assert no drift
        run: |
          set -euo pipefail
          bash orchestrator/scripts/sync-claude-templates.sh
          if ! git diff --quiet -- orchestrator/src/init/templates; then
            echo "::error::orchestrator/src/init/templates is stale relative to root CLAUDE.md / .claude/. Run 'npm --prefix orchestrator run sync-claude-templates' and commit the regenerated files."
            git --no-pager diff --stat -- orchestrator/src/init/templates
            exit 1
          fi
          echo "init templates are in sync with source."
