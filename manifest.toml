# Mars framework manifest
#
# Single source of truth for every framework-owned file that gets placed in
# a consumer repo by `mars install`. Downstream install / uninstall /
# version logic reads this file.
#
# Each entry has:
#   source       — path inside the framework repo (relative to repo root)
#   destination  — path inside the consumer repo (relative to consumer root)
#   executable   — if true, chmod +x after placement (defaults to false)
#
# The manifest is validated by `bun run scripts/validate-manifest.ts`,
# which is wired into the root `package.json`. Validation confirms the
# file parses cleanly and that every `source` path exists on disk.

version = 1

# --- Project CLAUDE.md ---------------------------------------------------

[[files]]
source = "CLAUDE.md"
destination = "CLAUDE.md"
executable = false

# --- Claude Code project settings ---------------------------------------

[[files]]
source = ".claude/settings.json"
destination = ".claude/settings.json"
executable = false

