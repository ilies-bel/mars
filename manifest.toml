# --- Mastra skill --------------------------------------------------------
#
# In the framework repo this skill lives at `.agents/skills/mastra/` and is
# exposed to Claude Code via a symlink at `.claude/skills/mastra`. In a
# consumer repo there is no `.agents/` tree, so install places the files
# directly under `.claude/skills/mastra/` (i.e. the symlink target is
# materialised).

[[files]]
source = ".agents/skills/mastra/SKILL.md"
destination = ".claude/skills/mastra/SKILL.md"
executable = false

